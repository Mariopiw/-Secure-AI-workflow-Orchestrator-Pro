[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-ai-workflow-orchestrator-pro"
version = "0.2.0"
description = "Production-oriented secure AI workflow orchestration reference implementation"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.0",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy==2.1.3",
  "psycopg[binary]>=3.2,<4",
  "alembic==1.20.0",
  "pydantic-settings==2.15.0",
  "celery[redis]==5.6.2",
  "httpx==0.28.1",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
